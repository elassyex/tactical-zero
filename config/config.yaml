# TACTICAL ZERO Configuration

# API Keys
shodan_api_key: ""
vt_api_key: ""
openai_api_key: ""

# AI Provider: "openai", "ollama", "custom", or "" (auto-detect)
# - openai: uses OpenAI API (needs openai_api_key)
# - ollama: uses local Ollama server
# - custom: any OpenAI-compatible API (set ai_base_url)
ai_provider: ""
ai_base_url: ""
ai_api_key: ""

# Model name (depends on provider)
# OpenAI: gpt-4o, gpt-4o-mini, gpt-3.5-turbo
# Ollama: bugbounty-hunter, llama3, mistral, etc
# Custom: any model your endpoint supports
model: "gpt-4o"

# Ollama configuration (only used if ai_provider=ollama)
ollama_host: "http://localhost:11434"

# Nuclei templates directory
nuclei_templates_dir: "/Users/mac/nuclei-templates"

# Notifications
slack_webhook: ""
discord_webhook: ""
telegram_bot_token: ""
telegram_chat_id: ""

# Focus mode: all, api, web, infrastructure, mobile, cloud
focus: all

# Noise filtering: low, medium, high
noise_filter_level: high

# Custom scripts directory
custom_scripts_dir: "./custom_scripts"

# Wordlists paths (auto-detected if available, override here if needed)
wordlists:
  dns_top: "/usr/share/wordlists/seclists/Discovery/DNS/subdomains-top1million-110000.txt"
  dns_jhaddix: "/usr/share/wordlists/seclists/Discovery/DNS/dns-Jhaddix.txt"
  dir_common: "/usr/share/wordlists/seclists/Discovery/Web-Content/common.txt"
  dir_raft_med: "/usr/share/wordlists/seclists/Discovery/Web-Content/raft-medium-directories.txt"
  params: "/usr/share/wordlists/seclists/Discovery/Web-Content/burp-parameter-names.txt"
